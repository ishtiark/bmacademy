<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Exam Question Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7FB;--surface:#fff;--ink:#0E1B3D;--muted:#4A5878;--line:#DDE2EE;--accent:#B87400;--teal:#0B7A70;--code:#EEF1F8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1430;--surface:#16264F;--ink:#fff;--muted:#B8C4E0;--line:#2A3E73;--accent:#FFB703;--teal:#2EC4B6;--code:#0E1B3D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1430;--surface:#16264F;--ink:#fff;--muted:#B8C4E0;--line:#2A3E73;--accent:#FFB703;--teal:#2EC4B6;--code:#0E1B3D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
.hero{background:#0E1B3D;color:#fff;padding:40px 20px}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}.hero .wrap{padding:0}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:1px;color:#2EC4B6}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(30px,6.5vw,50px);line-height:1.05;margin:8px 0 12px}h1 span{color:#FFB703}
.hero p{color:#B8C4E0;margin:0;max-width:620px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.stats div{background:#16264F;border:1px solid #2A3E73;border-radius:12px;padding:10px 16px;font-size:14px;color:#B8C4E0}
.stats b{display:block;font-size:22px;color:#FFB703;font-family:'Space Grotesk',sans-serif}
.stack{display:flex;flex-direction:column;gap:16px;margin:28px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--accent)}
.hrs{background:var(--teal);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:23px;margin:6px 0 10px}
.blocks{list-style:none;margin:0;padding:0}
.blocks li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.t{flex:0 0 48px;font-weight:700;color:var(--teal)}
.card h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);margin:16px 0 6px}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.out{font-weight:600;margin:0}
.note{color:var(--muted);font-size:14px;text-align:center;padding:0 0 32px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 14px}
.q p{margin:0 0 10px;font-weight:600}
.q label{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;font-size:15px;cursor:pointer}
.q label.good{border-color:#1a9c5b;background:rgba(26,156,91,.18)}
.q label.bad{border-color:#d33;background:rgba(221,51,51,.15)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 40px}
.btn{font:inherit;font-weight:700;padding:10px 20px;border-radius:10px;border:0;background:var(--accent);color:#0E1B3D;cursor:pointer}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
#score{font-weight:700;font-size:18px}
</style></head><body>
<header class="hero"><div class="wrap"><div class="brand">BM ACADEMY</div><h1>Exam <span>Question Bank</span></h1><p>52 multiple-choice questions, 4 for each of the 13 modules. Pick a module, answer, and check your score.</p>
<div class="stats"><div><b>13</b>modules</div><div><b>52</b>questions</div></div></div></header>
<main class="wrap"><div class="tabs" id="tabs"></div><div id="qs"></div>
<div class="bar"><button class="btn" id="chk">Check answers</button><button class="btn alt" id="key">Show answer key</button><button class="btn alt" id="rst">Reset</button><span id="score"></span></div>
<p class="note">Questions test course concepts, not button names, because tool menus change often. Trainers can add more questions for each module.</p></main>
<script>
const D=[{"c": "00", "n": "Foundations & Prompt Engineering", "q": [{"q": "What does the RTCF prompt formula stand for?", "o": ["Role, Task, Context, Format", "Read, Think, Check, Finish", "Rewrite, Translate, Copy, Fix", "Request, Test, Compare, Finalize"], "a": 0}, {"q": "Why must you fact-check AI answers?", "o": ["AI cannot write numbers", "AI can give confident answers that are wrong", "AI always copies from one website", "AI answers are always outdated"], "a": 1}, {"q": "Which information should never be pasted into an AI tool?", "o": ["A made-up sample name", "A topic you want explained", "Passwords, NID and bank numbers", "A public news headline"], "a": 2}, {"q": "Your first answer is weak. What is the best next step?", "o": ["Accept it and move on", "Repeat the same prompt unchanged", "Delete the chat and stop", "Add context and clearer limits in a follow-up"], "a": 3}]}, {"c": "01", "n": "ChatGPT", "q": [{"q": "What is a Custom GPT?", "o": ["A free copy of the internet", "A ChatGPT set up with your own instructions and files for one task", "A new keyboard layout", "A tool that only edits photos"], "a": 1}, {"q": "What should you do before uploading a file for analysis?", "o": ["Convert it to an image", "Nothing, all files are safe", "Remove sensitive or private information", "Rename it to a number"], "a": 2}, {"q": "ChatGPT gives you statistics. What next?", "o": ["Publish them straight away", "Ask it to make them bigger", "Ignore the numbers", "Verify them with a reliable source"], "a": 3}, {"q": "Your Custom GPT fails 3 of 10 test questions. What do you do?", "o": ["Improve its instructions and test again", "Delete it", "Tell users to avoid those questions", "Add more random files"], "a": 0}]}, {"c": "02", "n": "Microsoft Copilot", "q": [{"q": "Copilot in Excel is best used to:", "o": ["Create passwords", "Edit videos", "Ask in plain language for formulas and charts, then check the results", "Replace all manual checking"], "a": 2}, {"q": "Copilot inside Word and Excel usually needs:", "o": ["A voice recorder", "A printer", "A gaming laptop", "A Microsoft 365 account with Copilot enabled"], "a": 3}, {"q": "In Outlook, Copilot can help you:", "o": ["Summarize long threads and draft replies you review", "Send emails without reading them", "Delete your inbox", "Change your password"], "a": 0}, {"q": "A deck made by Copilot from a document should be:", "o": ["Deleted", "Checked for facts and layout before use", "Sent as it is", "Printed without opening"], "a": 1}]}, {"c": "03", "n": "Deepseek", "q": [{"q": "When is reasoning mode most useful?", "o": ["For choosing a font", "For resizing photos", "For recording audio", "For multi-step maths and logic problems"], "a": 3}, {"q": "What makes a tool comparison fair?", "o": ["The same task and the same scoring for every tool", "Different tasks for each tool", "Using only your favourite tool", "Judging by the logo"], "a": 0}, {"q": "What privacy rule applies to Deepseek labs?", "o": ["No rule is needed", "Keep data non-sensitive and read the privacy policy", "Paste client files", "Share passwords"], "a": 1}, {"q": "You get a code error. What should you paste?", "o": ["A photo of the room", "Your password", "The error message and the relevant code", "Only the word 'help'"], "a": 2}]}, {"c": "04", "n": "Gemini", "q": [{"q": "Deep Research is best for:", "o": ["Multi-source research whose sources you then verify", "Fixing spelling only", "Making logos", "Changing audio speed"], "a": 0}, {"q": "What is a Gem?", "o": ["A spreadsheet formula", "A custom Gemini with saved instructions for one task", "A photo filter", "A paid certificate"], "a": 1}, {"q": "Gemini inside Gmail and Docs depends on:", "o": ["The time of day", "Keyboard brand", "Your account type and settings", "Screen colour"], "a": 2}, {"q": "Best prompt for a PDF summary:", "o": ["Do it", "Make it nice", "Read it fast", "Summarize in one page, list 5 key points, add 3 questions"], "a": 3}]}, {"c": "05", "n": "Grammarly", "q": [{"q": "Setting goals such as audience and formality:", "o": ["Turns on plagiarism", "Tunes suggestions to the situation", "Deletes your text", "Changes the file type"], "a": 1}, {"q": "Grammarly mainly supports:", "o": ["Voice recording", "Photo retouching", "English writing", "Video editing"], "a": 2}, {"q": "Best practice for suggestions:", "o": ["Accept all at once", "Reject all", "Close the tool", "Accept only those you understand"], "a": 3}, {"q": "A plagiarism check:", "o": ["Flags similar text, but you must still cite sources", "Makes copying legal", "Proves your work is original", "Replaces citations"], "a": 0}]}, {"c": "06", "n": "Quillbot", "q": [{"q": "After paraphrasing a source, you must:", "o": ["Claim it as your idea", "Change the title only", "Still cite the original source", "Remove the reference"], "a": 2}, {"q": "What should you check after a paraphrase?", "o": ["That the text is longer", "That it uses rare words", "Nothing", "That the meaning did not change"], "a": 3}, {"q": "APA and MLA are:", "o": ["Citation styles", "Photo formats", "Video codecs", "Font families"], "a": 0}, {"q": "After using the summarizer, you should:", "o": ["Delete the source", "Check facts against the original", "Trust it fully", "Add new claims"], "a": 1}]}, {"c": "07", "n": "Jasper", "q": [{"q": "What is a brand voice?", "o": ["A paid ringtone", "A video filter", "A password", "A saved description of how a brand sounds, for consistent copy"], "a": 3}, {"q": "A strong ad follows:", "o": ["Hook, benefit, proof, call to action", "Title, date, signature", "Problem only", "Long history"], "a": 0}, {"q": "What is A/B testing?", "o": ["Copying a competitor", "Comparing two or more versions to see which performs better", "Spelling both ways", "Editing in two apps"], "a": 1}, {"q": "Before publishing generated copy:", "o": ["Skip the edit", "Translate it first", "Fact-check every claim", "Add more adjectives"], "a": 2}]}, {"c": "08", "n": "Canva", "q": [{"q": "How many fonts does the course recommend per design?", "o": ["Two at most", "Ten", "One per word", "As many as possible"], "a": 0}, {"q": "For printing, export as:", "o": ["A screenshot", "PDF Print", "A GIF", "A tiny JPG"], "a": 1}, {"q": "A Brand Kit stores:", "o": ["Bank details", "Only photos", "Logo, colours and fonts", "Passwords"], "a": 2}, {"q": "The ratio for Reels and Shorts is:", "o": ["16:9", "4:3", "1:1", "9:16"], "a": 3}]}, {"c": "09", "n": "Pixlr", "q": [{"q": "Why keep an original copy of every photo?", "o": ["Pixlr requires it", "So you can compare and start again", "To use more storage", "It is a legal rule"], "a": 1}, {"q": "Catalogue product photos should have:", "o": ["Heavy filters", "Different crops each time", "A clean background and a consistent size", "Random backgrounds"], "a": 2}, {"q": "Which format supports transparency?", "o": ["JPG", "MP3", "DOC", "PNG"], "a": 3}, {"q": "Generative fill edits should be:", "o": ["Used honestly and labelled when needed", "Hidden always", "Used to fake reviews", "Used on private photos"], "a": 0}]}, {"c": "10", "n": "Invideo", "q": [{"q": "The most important part of a short video is:", "o": ["The file name", "The folder", "The first 3 seconds, the hook", "The last logo"], "a": 2}, {"q": "Before approving a generated video, you should:", "o": ["Export immediately", "Delete the voice", "Turn off captions", "Read and edit the script"], "a": 3}, {"q": "To post one video on YouTube, Reels and Facebook:", "o": ["Export 16:9, 9:16 and 1:1 versions", "Use only one size", "Stretch the video", "Crop the logo"], "a": 0}, {"q": "Stock media and music require you to:", "o": ["Remove all audio", "Check usage rights", "Ignore licences", "Rename the files"], "a": 1}]}, {"c": "11", "n": "Eleven Labs", "q": [{"q": "Cloning someone's voice requires:", "o": ["Nothing", "A longer script", "A new email", "Their permission"], "a": 3}, {"q": "A mispronounced brand name can be fixed by:", "o": ["Spelling it phonetically in the script", "Raising the volume", "Shouting at the mic", "Deleting the brand"], "a": 0}, {"q": "Writing for the ear means:", "o": ["No punctuation", "Short sentences, one idea per line", "Very long paragraphs", "Only numbers"], "a": 1}, {"q": "Before using Bangla for client work, you should:", "o": ["Skip the review", "Remove the voice", "Test the language quality first", "Assume it is perfect"], "a": 2}]}, {"c": "12", "n": "Capstone Project", "q": [{"q": "What is the best order of work?", "o": ["Brief, research, copy, design and video, quality check, pitch", "Pitch, copy, brief", "Video, pitch, research", "Design only"], "a": 0}, {"q": "The final quality check includes:", "o": ["Nothing", "Facts, spelling, brand consistency, rights and AI labels", "Only the file name", "Only colours"], "a": 1}, {"q": "How long is the final pitch?", "o": ["30 minutes", "Two hours", "8 minutes", "1 minute"], "a": 2}, {"q": "The capstone is graded out of:", "o": ["10 marks", "50 marks", "500 marks", "100 marks"], "a": 3}]}];let cur=0;
const $=i=>document.getElementById(i);
function show(){
  $('score').textContent='';
  $('tabs').innerHTML=D.map((m,i)=>`<button class="${i==cur?'on':''}" data-i="${i}">${m.c} ${m.n}</button>`).join('');
  $('qs').innerHTML=D[cur].q.map((q,i)=>`<div class="q"><p>${i+1}. ${q.q}</p>${q.o.map((o,j)=>`<label data-j="${j}"><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}</div>`).join('');
}
function mark(reveal){
  let s=0;const qs=document.querySelectorAll('.q');
  D[cur].q.forEach((q,i)=>{
    const sel=qs[i].querySelector('input:checked');const ls=qs[i].querySelectorAll('label');
    ls.forEach(l=>l.classList.remove('good','bad'));
    ls[q.a].classList.add('good');
    if(sel&&+sel.value===q.a)s++;else if(sel)ls[+sel.value].classList.add('bad');
  });
  return s;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=+b.dataset.i;show();}});
$('chk').onclick=()=>{const s=mark();$('score').textContent='Score: '+s+' / '+D[cur].q.length;};
$('key').onclick=()=>{mark();$('score').textContent='Answer key shown in green';};
$('rst').onclick=show;
show();
</script></body></html>
